# 初始化tagID, 小于0表示不启用
# Initial tag ID, set smaller than 0 to disable
# 只影响修改后加入的新玩家
# Only effect new players after modified it
init-tag: -1
# 消息前缀
# As word "prefix" means
prefix: "<white>[<color:#96bfff>LTag<white>] "

# 数据存储配置
# Data storage configuration
storage:
  # 存储类型: yaml 或 mysql
  # Storage type: yaml or mysql
  type: yaml
  # MySQL 配置 (仅在 type: mysql 时使用)
  # MySQL configuration (only used when type: mysql)
  mysql:
    host: localhost
    port: 3306
    database: lighttag
    username: root
    password: ""