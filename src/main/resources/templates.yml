main:
  title: "<yellow>LightTag面板"
  ui:
    - "ooooooooo"
    - "osoboaopo"
    - "ooooooooc"
  items:
    s:
      material: NAME_TAG
      amount: 1
      title: "<!i><yellow>设置称号"
      actions:
        - "OpenPage:SetTagGUI"
    b:
      material: EMERALD
      amount: 1
      title: "<!i><yellow>购买称号"
      actions:
        - "OpenPage:BuyTagGUI"
    a:
      material: WRITABLE_BOOK
      amount: 1
      title: "<!i><yellow>称号图鉴"
      actions:
        - "OpenPage:AlmanacGUI"
    p:
      material: PLAYER_HEAD
      amount: 1
      title: "<!i>个人信息"
      head: true
      lore:
        - "<!i><white>已拥有{PlayerTagTotal}个称号"
        - "<!i><white>当前正在使用: {PlayerUsingTagView}"
    c:
      material: BARRIER
      amount: 1
      title: "<!i><red>禁用称号"
      actions:
        - "ClearTag: "
        - "Close:"
    o:
      material: WHITE_STAINED_GLASS_PANE
      amount: 1
      title: ""
set:
  title: "<yellow>称号设置"
  ui:
    - "ooooooooo"
    - "o-------o"
    - "o-------o"
    - "o-------o"
    - "o-------o"
    - "aoobocooo"
  tag:
    material: NAME_TAG
    amount: 1
    title: "<!i><white>{TagView}"
    lore:
      - "<!i><white>称号: {TagView}"
      - "<!i><white>{TagType}"
      - "<!i><white>ID: {TagId}"
      - ""
      - "<!i><white>点击使用"
    actions:
      - "SetTag:{TagId}"
      - "Close:"
  items:
    o:
      material: "WHITE_STAINED_GLASS_PANE"
      amount: 1
      title: ""
    a:
      material: "ARROW"
      amount: 1
      title: "<!i><white>返回上一页"
      actions:
        - "OpenPage:MainGUI"
    b:
      material: "TIPPED_ARROW"
      amount: 1
      title: "<!i><white>上一页"
      flags:
        - HIDE_ADDITIONAL_TOOLTIP
      potion: "SLOW_FALLING"
      actions:
        - "Pages:Previous"
      item:
        ==: org.bukkit.inventory.ItemStack
        DataVersion: 4440
        id: minecraft:tipped_arrow
        count: 1
        components:
          minecraft:potion_contents: '{potion:"minecraft:slow_falling"}'
        schema_version: 1
    c:
      material: "TIPPED_ARROW"
      amount: 1
      title: "<!i><white>下一页"
      flags:
        - HIDE_ADDITIONAL_TOOLTIP
      potion: "WIND_CHARGED"
      actions:
        - "Pages:Next"
      item:
        ==: org.bukkit.inventory.ItemStack
        DataVersion: 4440
        id: minecraft:tipped_arrow
        count: 1
        components:
          minecraft:potion_contents: '{potion:"minecraft:wind_charged"}'
        schema_version: 1
